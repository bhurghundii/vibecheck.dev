version: 2
updates:
  # GitHub Actions used in .github/workflows/ (actions/checkout,
  # actions/github-script).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # The python:*-slim base image pinned in Dockerfile.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # httptools (via uvicorn[standard]) has no Python 3.15 wheel yet, and the
      # slim image has no compiler to build one, so the image fails to build.
      # Drop this once httptools publishes cp315 wheels.
      - dependency-name: "python"
        versions: [">=3.15"]

  # pyproject.toml / uv.lock. The uv ecosystem updates both together; the pip
  # ecosystem bumped pyproject.toml without refreshing uv.lock, which broke
  # CI's lockfile check.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
