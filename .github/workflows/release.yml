name: release

# Publishes the Docker image to GitHub Container Registry and creates the
# GitHub Release when a version tag is pushed:
#
#   git tag -a v0.1.0 -m "v0.1.0" && git push origin v0.1.0
#
# A tag with a hyphen (v0.1.0-rc1) is a pre-release: it is published and
# marked as one, and does not move `latest`.
#
# The image is ghcr.io/<owner>/<repo>. GHCR packages start private; after the
# first push, set the package to public once in the repo's Packages settings.
on:
  push:
    tags: ["v*"]

# The repository default is read-only, so ask for exactly what this job needs.
permissions:
  contents: write # create the GitHub Release
  packages: write # push to ghcr.io

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # arm64 is built under emulation, so the image runs on Apple Silicon
      # and ARM servers as well as amd64.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # vX.Y.Z -> X.Y.Z and X.Y, plus `latest` unless it is a pre-release.
      # The labels it sets include the source repo, which links the package
      # to this repository.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          flags=(--generate-notes --verify-tag)
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" "${flags[@]}"
