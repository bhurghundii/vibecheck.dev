name: vibecheck

# Merge gate: asks whoever opened/updated the PR a question about their own
# diff. See README for the phase breakdown; this workflow is the "Action"
# side of the Action-facing API (POST /sessions).
#
# The gate is not this job. It's the `vibecheck/verdict` commit status, which
# the vibecheck server posts on the PR's head commit — pending as soon as the
# session exists, success or failure the moment the answer is graded (needs
# GITHUB_STATUS_TOKEN on the server; see INTEGRATION.md). Make that the
# required check. This job only opens the session and links it on the PR,
# so it finishes in seconds. It goes red for exactly one reason: the server
# rejected the PR itself before asking anything (the EVALUATOR checks, e.g.
# too many changed lines), which it explains in a PR comment. Anything else
# (vibecheck unreachable, a bad request) is a warning and still passes. A
# vibecheck outage should not read as "your PR is broken".
#
# It used to wait for the answer here instead: poll GET /verdict for ten
# minutes, then fail on whatever it last saw. Authors rarely answer inside
# ten minutes — and couldn't have here, since the link was only commented
# after the polling loop finished — so the check was red on nearly every
# PR, and held a runner for ten minutes getting there.
#
# Runs on a GitHub-hosted runner — vibecheck is hosted publicly (see the
# VIBECHECK_BASE_URL secret), so any ubuntu-latest runner can reach it.
#
# Runs with secrets on fork PRs too: never check out or run the PR's code.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  # Not named `vibecheck`, which is what the old blocking job was called: a
  # repo whose branch protection still requires that check then blocks
  # merges ("Expected — waiting for status") until it's pointed at
  # `vibecheck/verdict`, rather than quietly letting PRs through ungated.
  # Was `ask` until it became non-blocking; the same reasoning applies to a
  # protection rule still requiring `ask`.
  grill:
    runs-on: ubuntu-latest
    steps:
      - name: Check vibecheck is configured for this run
        id: config
        env:
          VIBECHECK_BASE_URL: ${{ secrets.VIBECHECK_BASE_URL || secrets.GRUMPY_BASE_URL }}
          VIBECHECK_TOKEN: ${{ secrets.VIBECHECK_TOKEN || secrets.GRUMPY_TOKEN }}
        run: |
          set -euo pipefail

          if [ -n "$VIBECHECK_BASE_URL" ] && [ -n "$VIBECHECK_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "configured=false" >> "$GITHUB_OUTPUT"
          reason="the VIBECHECK_BASE_URL and/or VIBECHECK_TOKEN repository secrets are not set"
          echo "::notice title=vibecheck skipped::Not run because $reason."
          {
            echo "### vibecheck: SKIPPED"
            echo
            echo "Not run because $reason."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Ask vibecheck
        id: vibecheck
        if: steps.config.outputs.configured == 'true'
        env:
          VIBECHECK_BASE_URL: ${{ secrets.VIBECHECK_BASE_URL || secrets.GRUMPY_BASE_URL }}
          VIBECHECK_TOKEN: ${{ secrets.VIBECHECK_TOKEN || secrets.GRUMPY_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Three dots, not two. github.event.pull_request.base.sha is the
          # tip of the base branch at event time, NOT the merge base. So
          # once anything lands on the base branch after this PR was
          # opened, a two-dot diff also contains the *reverse* of those
          # commits — code the PR author never touched, presented to them as
          # their own change and to the grader as a claim about this diff.
          # `A...B` diffs from the merge base, which is what "the whole PR
          # against its base" actually means.
          if ! gh api "repos/$REPO/compare/$BASE_SHA...$HEAD_SHA" \
              -H "Accept: application/vnd.github.diff" > /tmp/vibecheck.diff; then
            echo "::warning title=vibecheck unavailable::Could not fetch this PR's diff from the GitHub API."
            echo "### vibecheck: UNAVAILABLE (could not fetch the diff), not blocking" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Called on every run, not only when no session exists yet. It's
          # idempotent — a re-run gets the existing session back with a 200
          # instead of a 201 — and it's also what makes the server re-post
          # `vibecheck/verdict`, so re-running this job is the fix if a status
          # post to GitHub ever failed.
          code=$(jq -n \
            --arg repo "$REPO" \
            --argjson pr_number "$PR_NUMBER" \
            --arg head_sha "$HEAD_SHA" \
            --arg base_sha "$BASE_SHA" \
            --rawfile diff /tmp/vibecheck.diff \
            '{repo: $repo, pr_number: $pr_number, head_sha: $head_sha, base_sha: $base_sha, diff: $diff}' \
            | curl -sS -o /tmp/vibecheck.json -w '%{http_code}' -X POST \
                -H "Authorization: Bearer $VIBECHECK_TOKEN" \
                -H "Content-Type: application/json" \
                --data @- \
                "$VIBECHECK_BASE_URL/sessions" || true)

          # The one way this job goes red: the server rejected the PR itself
          # (EVALUATOR's checks, e.g. too many changed lines) before asking
          # anything. Told apart from a malformed-request 422 by the
          # `rejection` key, which only a rejection carries.
          rejection=""
          if [ "$code" = "422" ]; then
            rejection=$(jq -r '.rejection // empty' /tmp/vibecheck.json 2>/dev/null || true)
          fi
          if [ -n "$rejection" ]; then
            {
              echo "rejection<<VIBECHECK_EOF"
              echo "$rejection"
              echo "VIBECHECK_EOF"
            } >> "$GITHUB_OUTPUT"
            echo "::error title=vibecheck rejected this PR::$rejection"
            {
              echo "### vibecheck: REJECTED"
              echo
              echo "$rejection"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # Anything else is vibecheck's problem, not the PR's, so warn and
          # pass. `|| true` on curl keeps `set -e` from failing
          # the step when the server can't be reached at all (code 000).
          if [ "$code" != "200" ] && [ "$code" != "201" ]; then
            echo "::warning title=vibecheck unavailable::POST /sessions returned HTTP $code: $(cat /tmp/vibecheck.json 2>/dev/null)"
            echo "### vibecheck: UNAVAILABLE (HTTP $code), not blocking" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Only a newly created session gets a PR comment, so re-runs
          # don't pile up duplicate links.
          if [ "$code" = "201" ]; then
            echo "session_url=$(jq -r .session_url /tmp/vibecheck.json)" >> "$GITHUB_OUTPUT"
          fi
          echo "### vibecheck: $(jq -r .status /tmp/vibecheck.json)" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment session link
        # always(): a rejection fails the step above, and its comment is
        # the one the author most needs to see.
        if: always() && (steps.vibecheck.outputs.session_url || steps.vibecheck.outputs.rejection)
        # A failed comment (rate limit, token scope) loses the message but
        # must not change the job's result; the session, or the rejection
        # in the job summary, still exists. The text arrives via env, not
        # ${{ }} inside the script, so it can never be parsed as code.
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          SESSION_URL: ${{ steps.vibecheck.outputs.session_url }}
          REJECTION: ${{ steps.vibecheck.outputs.rejection }}
        with:
          script: |
            const body = process.env.REJECTION
              ? [
                  "**vibecheck** rejected this PR before asking anything:",
                  "",
                  `> ${process.env.REJECTION}`,
                ]
              : [
                  "**vibecheck** wants to check you understand this PR. Answer one question about the change:",
                  "",
                  process.env.SESSION_URL,
                  "",
                  "Your answer is graded, and the result shows up as the `vibecheck/verdict` check on this PR.",
                ];
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body.join("\n"),
            });
