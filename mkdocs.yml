site_name: vibecheck
site_description: Quizzes your team on their AI's code before it merges.
site_url: https://bhurghundii.com/vibecheck.dev/
repo_url: https://github.com/bhurghundii/vibecheck.dev
repo_name: bhurghundii/vibecheck.dev
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
  palette:
    - scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight

nav:
  - Home: index.md
  - Getting started:
      - Quickstart: quickstart.md
      - How it works: how-it-works.md
  - Using vibecheck:
      - Wire it into a repo: wire-it-up.md
      - Blocking PRs: blocking-prs.md
      - Check commits before they land: pre-commit.md
      - Configuration: configuration.md
  - Running it:
      - Deploying to Railway: deploy-railway.md
      - Before you make it public: security.md
      - Local development: development.md
  - Limitations: limitations.md
